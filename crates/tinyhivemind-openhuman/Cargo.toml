[package]
name = "tinyhivemind-openhuman"
description = "Permanent hive tools and continuing turns for host-supplied OpenHuman agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
# The adapter names the host's exact OpenHuman Agent and native Tool types.
# Git sources are patched by the consuming workspace to its single checkout.

[[example]]
name = "live_language"
required-features = ["offline"]

[features]
# Loopback backend fixtures for standalone deterministic host examples.
offline = ["dep:wiremock"]

[dependencies]
# Supplied handles and their continuing turn API.
openhuman-embed.workspace = true
# Host usage and policy types remain OpenHuman's own.
openhuman.workspace = true
# Native tool trait and results used by permanent attachments.
tinytools.workspace = true
# Async native tool methods.
async-trait.workspace = true
# OpenHuman errors and the native tool result boundary.
anyhow.workspace = true
# Render schemas and attributed input.
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
# Turn timeout and progress channels.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# Core bound-handle trait and optional host log.
tinyhivemind-core.workspace = true
# Convert portable hive definitions at the host boundary.
tinyhivemind-lang.workspace = true
# Durable messaging and cross-hive scheduling.
tinyhivemind-hives.workspace = true
# The engine contract and agent memory lifecycle behind hive `Recall`/`Remember`.
tinymemory-api.workspace = true
tinymemory-tools.workspace = true
# Deterministic standalone host fixtures.
wiremock = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# The routing surfaces, for a test that builds its own hive.

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wiremock.workspace = true
# The in-memory reference engine, for offline `Recall`/`Remember` tests.
tinymemory-api = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
